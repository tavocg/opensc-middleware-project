app default {
    debug = 0;
    card_drivers = iasecc;
    card_driver iasecc { chipdoc_profile = cr-rsa2048; }
    reader_driver pcsc {
        enable_pinpad = false;
        enable_pace = false;
        disconnect_action = leave;
        transaction_end_action = leave;
        reconnect_action = leave;
    }
    framework pkcs15 {
        use_file_caching = no;
        use_pin_caching = no;
        try_emulation_first = no;
    }
    pkcs11 { atomic = false; lock_login = false; slots_per_card = 1; }
}
